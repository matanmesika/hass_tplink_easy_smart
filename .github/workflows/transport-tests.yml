name: TP-Link transport regression tests

on:
  push:
    branches:
      - fix/http-disconnect-recovery
  pull_request:
    paths:
      - 'custom_components/tplink_easy_smart/**'
      - 'tests/**'
      - '.github/workflows/transport-tests.yml'
  workflow_dispatch:

jobs:
  transport-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest aiohttp json5==0.9.10
      - name: Run regression tests
        run: |
          python -m compileall -q custom_components/tplink_easy_smart
          python -m pytest -q tests/test_connection_recovery.py tests/test_coordinator_disconnect.py
